<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{brand} veb-paneli: do'kon hisobi, hisobotlar, eksport va xodimlar." />
    <title>{brand} — panel</title>
    <!-- The panel can be installed (the Mini App and the administrators' entry cannot): its manifest,
         its icons, and the color of the browser's own bars, which is the page's ground in each theme
         (tokens.css, the `bg` token; panel/pwa/pwaFiles.test.ts holds the values to the tokens). -->
    <link rel="manifest" href="/panel/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171c26" />
    <link rel="icon" type="image/svg+xml" href="/panel/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/panel/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/panel/main.tsx"></script>
  </body>
</html>
