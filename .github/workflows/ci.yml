name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      QD_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Layering contracts
        run: lint-imports --config pyproject.toml
      - name: Migrations apply to an empty database
        run: |
          psql "$QD_TEST_ADMIN_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE qd_migrate_check'
          QD_MIGRATION_URL=postgresql://postgres:postgres@127.0.0.1:5432/qd_migrate_check alembic upgrade head
      - name: Tests
        run: pytest -q
      - name: Dependency vulnerabilities
        run: pip-audit --require-hashes -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build and bundle budget (NFR-010)
        run: npm run size
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high

  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No unresolved placeholders in stage documents
        run: |
          if grep -rnE 'TODO|TBD|<fill' docs/*/OUTPUT.md; then
            echo "placeholder content found in stage documents" >&2
            exit 1
          fi
