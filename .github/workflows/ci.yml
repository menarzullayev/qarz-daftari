name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      QD_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Layering contracts
        run: lint-imports --config pyproject.toml
      - name: Migrations apply to an empty database
        run: |
          psql "$QD_TEST_ADMIN_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE qd_migrate_check'
          QD_MIGRATION_URL=postgresql://postgres:postgres@127.0.0.1:5432/qd_migrate_check alembic upgrade head
      - name: Tests
        run: pytest -q
      - name: Dependency vulnerabilities
        run: pip-audit --require-hashes -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build and bundle budget (NFR-010)
        run: npm run size
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high

  # The deployment files (deploy/production): both images build, the compose files are valid, the scripts
  # pass shellcheck, and the stack comes up on the runner and passes its own smoke test.
  deploy-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Scripts
        run: shellcheck --external-sources --severity=warning deploy/production/scripts/*.sh
      - name: Compose files are valid
        env:
          DEPLOY_RELEASE: ci
          QD_DATABASE_URL: postgresql://qd_app@db.invalid/qarz
          QD_MIGRATION_URL: postgresql://owner@db.invalid/qarz
          LOCAL_POSTGRES_PASSWORD: ci
          LOCAL_APP_PASSWORD: ci
        run: |
          docker compose -f deploy/production/compose.yml config --quiet
          docker compose -f deploy/production/compose.yml -f deploy/production/compose.local.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: qarz-daftari/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/production/nginx/Dockerfile
          load: true
          build-args: VITE_BOT_USERNAME=qd_local_proof_bot
          tags: qarz-daftari/proxy:${{ github.sha }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,scope=proxy,mode=max
      - name: The backend image runs as a non-root user and carries no tools
        run: |
          docker run --rm "qarz-daftari/backend:$COMMIT" sh -ec '
            test "$(id -u)" = 10001
            python -c "import qarz.interface.asgi, qarz.interface.worker"
            for tool in pip pytest ruff mypy; do
              if python -c "import $tool" 2>/dev/null; then echo "$tool is in the image" >&2; exit 1; fi
            done
          '
      - name: The stack comes up and passes the smoke test
        env:
          SMOKE_AUTH_WAIT: "0"
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          deploy/production/scripts/local.sh up
          deploy/production/scripts/local.sh smoke
      - name: Logs when it failed
        if: failure()
        run: docker compose -p qd-deploy-proof logs --no-color --tail 60 || true
      - name: Remove the stack
        if: always()
        run: deploy/production/scripts/local.sh down || true

  # The backup files (deploy/backup): the scripts pass shellcheck, the units pass systemd-analyze, the
  # proof's Compose overlay parses, and the alert rules pass their own tests. The proof itself
  # (deploy/backup/proof/run.sh all) takes about five minutes with its image builds and is run by hand.
  backup-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Scripts
        run: |
          shellcheck --external-sources --severity=style deploy/backup/scripts/*.sh deploy/backup/proof/run.sh
          for script in deploy/backup/scripts/*.sh deploy/backup/proof/run.sh; do
            bash -n "$script"
            test -x "$script" || { echo "$script is not executable" >&2; exit 1; }
          done
          if grep -rIl $'\r' deploy/backup; then
            echo "carriage returns found" >&2
            exit 1
          fi
      - name: Units
        run: |
          sudo mkdir -p /opt/qarz-backup
          sudo cp -r deploy/backup/scripts /opt/qarz-backup/
          id postgres > /dev/null 2>&1 || sudo useradd --system postgres
          systemd-analyze verify --man=no deploy/backup/systemd/*.service deploy/backup/systemd/*.timer
          for timer in deploy/backup/systemd/*.timer; do
            sed -n 's/^OnCalendar=//p' "$timer" | while read -r calendar; do
              systemd-analyze calendar "$calendar" > /dev/null
            done
          done
      - name: The proof's Compose overlay is valid
        env:
          QD_POSTGRES_PASSWORD: ci
          QD_REPL_PASSWORD: ci
          QD_BACKUP_CIPHER_PASS: ci
          QD_FILESTORE_RPC_SECRET: ci
          QD_FILESTORE_ADMIN_TOKEN: ci
        run: |
          docker compose -p qd-backup-proof -f deploy/rehearsal/compose.yml \
            -f deploy/backup/proof/compose.proof.yml config --quiet
      - name: Alert rules and their tests
        run: |
          promtool() {
            docker run --rm -v "$PWD/deploy/monitoring:/rules:ro" --entrypoint promtool prom/prometheus:v3.5.0 "$@"
          }
          promtool check rules /rules/alerts.yml
          promtool test rules /rules/alerts.test.yml

  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No unresolved placeholders in stage documents
        run: |
          if grep -rnE 'TODO|TBD|<fill' docs/*/OUTPUT.md; then
            echo "placeholder content found in stage documents" >&2
            exit 1
          fi
