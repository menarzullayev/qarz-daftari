# Alert rules in the Prometheus format, written against what the application exposes at /metrics.
# Thresholds are those of docs/10-operations/OUTPUT.md, "Monitoring". Not yet loaded into any
# monitoring system: there are no servers. See README.md in this directory for what is missing.
groups:
  - name: qarz-api
    rules:
      - alert: ErrorRateHigh
        # Above 2% of answers are server errors for 5 minutes.
        expr: |
          sum(rate(qd_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(qd_requests_total[5m])), 0.001) > 0.02
        for: 5m
        labels: {severity: day, channel: operator-telegram}
        annotations: {summary: "More than 2% of requests fail"}

      - alert: RecordingSlow
        # 95th percentile of recording an entry above 400 ms (NFR-009) for 15 minutes.
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(
            qd_request_duration_ms_bucket{method="POST",route="/api/v1/shops/{shop_id}/customers/{customer_id}/entries"}[5m]
          ))) > 400
        for: 15m
        labels: {severity: day, channel: operator-telegram}
        annotations: {summary: "Recording an entry is slower than its target"}

      - alert: ChatSlow
        # 95th percentile of handling a Telegram update above 500 ms (NFR-001) for 15 minutes.
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(
            qd_request_duration_ms_bucket{route="/tg/webhook"}[5m]
          ))) > 500
        for: 15m
        labels: {severity: day, channel: operator-telegram}
        annotations: {summary: "The bot answers slower than its target"}

      - alert: OverviewSlow
        # 95th percentile of the overview and the debtors list above 300 ms (NFR-005) for 15 minutes.
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(
            qd_request_duration_ms_bucket{route=~"/api/v1/shops/[{]shop_id[}]/overview.*"}[5m]
          ))) > 300
        for: 15m
        labels: {severity: day, channel: operator-telegram}
        annotations: {summary: "The overview is slower than its target"}

  - name: qarz-messaging
    rules:
      - alert: OutboxOld
        # A message that is due has waited more than 10 minutes.
        expr: qd_outbox_oldest_due_seconds > 600
        for: 2m
        labels: {severity: day, channel: operator-telegram}
        annotations: {summary: "Messages on {{ $labels.channel }} are not being sent"}

      - alert: RemindersNotRunning
        # No reminder run recorded in an hour during sending hours (08:00 to 20:00 Tashkent, UTC+5).
        expr: qd_job_last_finished_seconds{job="reminders"} > 3900 and on() (hour() >= 3 and hour() < 15)
        for: 5m
        labels: {severity: day, channel: operator-telegram}
        annotations: {summary: "The reminder job has not finished for over an hour"}

  - name: qarz-subscription
    rules:
      - alert: ReceiptsWaiting
        # A subscription receipt has awaited an administrator's decision for more than 24 hours
        # (runbook 8). The owner paid and is still limited, or is about to be.
        expr: qd_receipts_oldest_waiting_seconds > 86400
        for: 10m
        labels: {severity: day, channel: operator-telegram}
        annotations: {summary: "A subscription receipt has waited more than a day for a decision"}

  - name: qarz-security
    rules:
      - alert: CrossTenantAttempt
        # Any signed-in session asking about a shop it is not a member of. Seen on sight.
        expr: increase(qd_security_events_total{kind="shop_not_member"}[10m]) > 0
        labels: {severity: sight, channel: operator-telegram}
        annotations: {summary: "A signed-in user asked about a shop that is not theirs"}

      - alert: InvalidSignaturesRepeated
        expr: |
          increase(qd_security_events_total{kind=~"bad_sign_in|bad_webhook_secret"}[10m]) > 10
        labels: {severity: sight, channel: operator-telegram}
        annotations: {summary: "Repeated invalid signatures ({{ $labels.kind }})"}

      - alert: AdminSecondFactorRepeated
        # Refused or locked second-factor codes on the administrator's side. Five in a row lock the
        # factor for fifteen minutes; more than that in a quarter of an hour is somebody trying.
        expr: increase(qd_security_events_total{kind="bad_second_factor"}[15m]) > 5
        labels: {severity: sight, channel: operator-telegram}
        annotations: {summary: "Repeated failed administrator second factor"}

      - alert: SupportAccessOpened
        # An administrator can read one shop's customers and entries until the access ends (REQ-059).
        # Expected now and then; the operator should know each time, and the shop's owner is told too.
        expr: increase(qd_security_events_total{kind="support_access_opened"}[10m]) > 0
        labels: {severity: sight, channel: operator-telegram}
        annotations: {summary: "An administrator opened a support access to a shop"}

      - alert: AdminWithoutSupportAccess
        # An administrator asked for a shop's customers without an open support access and was refused.
        expr: increase(qd_security_events_total{kind="admin_without_support_access"}[10m]) > 0
        labels: {severity: sight, channel: operator-telegram}
        annotations: {summary: "An administrator asked for a shop's data without support access"}

      - alert: ShopOwnerReassigned
        # An administrator gave a shop to another person (runbook 7). It happens only by the founder's
        # written decision, so the operator should be able to name the decision behind each one.
        expr: increase(qd_security_events_total{kind="owner_reassigned"}[10m]) > 0
        labels: {severity: sight, channel: operator-telegram}
        annotations: {summary: "An administrator reassigned the ownership of a shop"}

  - name: qarz-up
    rules:
      - alert: MetricsMissing
        # The application stopped answering the monitoring system. The external check of /healthz, from
        # outside both servers, is separate and is the one that reaches the operator's phone.
        expr: absent(qd_requests_total)
        for: 3m
        labels: {severity: phone, channel: external}
        annotations: {summary: "The application exposes no metrics"}

  # Host-level figures. They do not come from the application's /metrics: the scripts of deploy/backup
  # write them on the standby into the directory that node_exporter's textfile collector reads.
  - name: qarz-backup
    rules:
      - alert: BackupFailed
        # The last run of the weekly full or of the daily differential backup ended in failure.
        expr: qd_backup_last_run_success == 0
        for: 5m
        labels: {severity: day, channel: operator-telegram}
        annotations: {summary: "The last {{ $labels.type }} backup failed"}

      - alert: BackupMissing
        # No backup of any type for 26 hours (one is taken every night), no full backup for 8 days
        # (one is taken every week), or no figure at all.
        expr: |
          time() - max(qd_backup_last_success_timestamp_seconds) > 93600
            or time() - qd_backup_last_success_timestamp_seconds{type="full"} > 691200
            or absent(qd_backup_last_success_timestamp_seconds)
        for: 10m
        labels: {severity: day, channel: operator-telegram}
        annotations: {summary: "No recent backup in the repository"}

      - alert: WalArchiveStale
        # "Log archive age older than 5 minutes": the newest WAL segment in the repository is older
        # than that, there is none (-1), the check that measures it has not run for 5 minutes, or
        # there is no figure at all. This is the bound on what a lost primary loses (ADR-015).
        expr: |
          qd_wal_archive_newest_age_seconds > 300
            or qd_wal_archive_newest_age_seconds < 0
            or time() - qd_backup_check_timestamp_seconds > 300
            or absent(qd_wal_archive_newest_age_seconds)
        for: 1m
        labels: {severity: phone, channel: external}
        annotations: {summary: "The WAL archive is older than 5 minutes"}

      - alert: RestoreTestNotPassed
        # The weekly restore test of the latest backup has not passed for 8 days, or never has.
        expr: |
          time() - qd_backup_restore_test_last_success_timestamp_seconds > 691200
            or absent(qd_backup_restore_test_last_success_timestamp_seconds)
        for: 10m
        labels: {severity: day, channel: operator-telegram}
        annotations: {summary: "The restore test has not passed in 8 days"}
