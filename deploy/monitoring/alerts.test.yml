# Tests of the backup, security and SMS alert rules, for `promtool test rules deploy/monitoring/alerts.test.yml`.
# In these tests time() starts at 0, so a figure of 0 means "happened when the test began".
rule_files:
  - alerts.yml
evaluation_interval: 1m

tests:
  # Everything fresh: none of the four backup alerts fires.
  - name: healthy
    interval: 1m
    input_series:
      - series: 'qd_backup_last_run_success{type="full"}'
        values: '1x30'
      - series: 'qd_backup_last_run_success{type="diff"}'
        values: '1x30'
      - series: 'qd_backup_last_success_timestamp_seconds{type="full"}'
        values: '0x30'
      - series: 'qd_backup_last_success_timestamp_seconds{type="diff"}'
        values: '0x30'
      - series: 'qd_wal_archive_newest_age_seconds'
        values: '30x30'
      - series: 'qd_backup_check_timestamp_seconds'
        values: '0+60x30'
      - series: 'qd_backup_restore_test_last_success_timestamp_seconds'
        values: '0x30'
    alert_rule_test:
      - {eval_time: 20m, alertname: BackupFailed, exp_alerts: []}
      - {eval_time: 20m, alertname: BackupMissing, exp_alerts: []}
      - {eval_time: 20m, alertname: WalArchiveStale, exp_alerts: []}
      - {eval_time: 20m, alertname: RestoreTestNotPassed, exp_alerts: []}

  # Negative: the newest archived segment grows older than 5 minutes.
  - name: archive stale
    interval: 1m
    input_series:
      - series: 'qd_wal_archive_newest_age_seconds'
        values: '30 90 150 210 270 330 390 450 510 570'
      - series: 'qd_backup_check_timestamp_seconds'
        values: '0+60x9'
    alert_rule_test:
      - {eval_time: 4m, alertname: WalArchiveStale, exp_alerts: []}
      - eval_time: 7m
        alertname: WalArchiveStale
        exp_alerts:
          - exp_labels: {severity: phone, channel: external}
            exp_annotations: {summary: "The WAL archive is older than 5 minutes"}

  # Negative: the archive looks fresh, but only because the check stopped running.
  - name: check stopped
    interval: 1m
    input_series:
      - series: 'qd_wal_archive_newest_age_seconds'
        values: '30x15'
      - series: 'qd_backup_check_timestamp_seconds'
        values: '0x15'
    alert_rule_test:
      - {eval_time: 4m, alertname: WalArchiveStale, exp_alerts: []}
      - eval_time: 8m
        alertname: WalArchiveStale
        exp_alerts:
          - exp_labels: {severity: phone, channel: external}
            exp_annotations: {summary: "The WAL archive is older than 5 minutes"}

  # Negative: a backup run failed.
  - name: backup failed
    interval: 1m
    input_series:
      - series: 'qd_backup_last_run_success{type="full"}'
        values: '1x15'
      - series: 'qd_backup_last_run_success{type="diff"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: BackupFailed
        exp_alerts:
          - exp_labels: {severity: day, channel: operator-telegram, type: diff}
            exp_annotations: {summary: "The last diff backup failed"}

  # Negative: the nightly backup stops. Nothing at 20 hours, an alert after 26.
  - name: no backup for more than a day
    interval: 1m
    input_series:
      - series: 'qd_backup_last_success_timestamp_seconds{type="full"}'
        values: "0x1700"
      - series: 'qd_backup_last_success_timestamp_seconds{type="diff"}'
        values: "0x1700"
    alert_rule_test:
      - {eval_time: 20h, alertname: BackupMissing, exp_alerts: []}
      - eval_time: 27h
        alertname: BackupMissing
        exp_alerts:
          - exp_labels: {severity: day, channel: operator-telegram}
            exp_annotations: {summary: "No recent backup in the repository"}

  # Negative: differentials keep coming but the weekly full does not. Nothing at 7 days, an alert after 8.
  - name: no full backup for more than a week
    interval: 1m
    input_series:
      - series: 'qd_backup_last_success_timestamp_seconds{type="full"}'
        values: "0x13000"
      - series: 'qd_backup_last_success_timestamp_seconds{type="diff"}'
        values: "0+60x13000"
    alert_rule_test:
      - {eval_time: 7d, alertname: BackupMissing, exp_alerts: []}
      - eval_time: 9d
        alertname: BackupMissing
        exp_alerts:
          - exp_labels: {severity: day, channel: operator-telegram, type: full}
            exp_annotations: {summary: "No recent backup in the repository"}

  # Negative: the restore test stops passing. Nothing at 7 days, an alert after 8.
  - name: restore test not passed
    interval: 1m
    input_series:
      - series: 'qd_backup_restore_test_last_success_timestamp_seconds'
        values: "0x13000"
    alert_rule_test:
      - {eval_time: 7d, alertname: RestoreTestNotPassed, exp_alerts: []}
      - eval_time: 9d
        alertname: RestoreTestNotPassed
        exp_alerts:
          - exp_labels: {severity: day, channel: operator-telegram}
            exp_annotations: {summary: "The restore test has not passed in 8 days"}

  # An administrator reassigned a shop's owner. The application exposes the counter at zero from its
  # start, so the first event is an increase. Nothing before it, an alert after it, nothing once the
  # ten minutes have passed with the counter standing still.
  - name: an owner reassignment is seen once
    interval: 1m
    input_series:
      - series: 'qd_security_events_total{kind="owner_reassigned"}'
        values: '0x5 1x40'
    alert_rule_test:
      - {eval_time: 5m, alertname: ShopOwnerReassigned, exp_alerts: []}
      - eval_time: 8m
        alertname: ShopOwnerReassigned
        exp_alerts:
          - exp_labels: {severity: sight, channel: operator-telegram, kind: owner_reassigned}
            exp_annotations: {summary: "An administrator reassigned the ownership of a shop"}
      - {eval_time: 30m, alertname: ShopOwnerReassigned, exp_alerts: []}

  # Negative: other security events are not a reassignment.
  - name: another security event is not a reassignment
    interval: 1m
    input_series:
      - series: 'qd_security_events_total{kind="owner_reassigned"}'
        values: '0x40'
      - series: 'qd_security_events_total{kind="support_access_opened"}'
        values: '0x5 1x40'
    alert_rule_test:
      - {eval_time: 8m, alertname: ShopOwnerReassigned, exp_alerts: []}

  # Negative: the scripts report nothing at all (never installed, or the collector lost its directory).
  - name: no figures
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 15m
        alertname: BackupMissing
        exp_alerts:
          - exp_labels: {severity: day, channel: operator-telegram}
            exp_annotations: {summary: "No recent backup in the repository"}
      - eval_time: 15m
        alertname: WalArchiveStale
        exp_alerts:
          - exp_labels: {severity: phone, channel: external}
            exp_annotations: {summary: "The WAL archive is older than 5 minutes"}
      - eval_time: 15m
        alertname: RestoreTestNotPassed
        exp_alerts:
          - exp_labels: {severity: day, channel: operator-telegram}
            exp_annotations: {summary: "The restore test has not passed in 8 days"}

  # SMS (group qarz-messaging). Messages are sent, none fails and none waits: neither rule fires.
  - name: sms going out
    interval: 1m
    input_series:
      - series: 'qd_sms_messages_last_day{status="sent"}'
        values: '0+1x120'
      - series: 'qd_sms_messages_last_day{status="failed"}'
        values: '0x120'
      - series: 'qd_sms_messages_last_day{status="retrying"}'
        values: '0x120'
    alert_rule_test:
      - {eval_time: 100m, alertname: SmsRefused, exp_alerts: []}
      - {eval_time: 100m, alertname: SmsNotGoingOut, exp_alerts: []}

  # Negative: one SMS ends as failed. Seen within the hour, and not for ever after.
  - name: sms refused
    interval: 1m
    input_series:
      - series: 'qd_sms_messages_last_day{status="failed"}'
        values: '0x30 1x200'
      - series: 'qd_sms_messages_last_day{status="retrying"}'
        values: '0x230'
    alert_rule_test:
      - {eval_time: 25m, alertname: SmsRefused, exp_alerts: []}
      - eval_time: 40m
        alertname: SmsRefused
        exp_alerts:
          - exp_labels: {severity: day, channel: operator-telegram, status: failed}
            exp_annotations: {summary: "An SMS was refused by the provider or given up"}
      - {eval_time: 150m, alertname: SmsRefused, exp_alerts: []}
      - {eval_time: 150m, alertname: SmsNotGoingOut, exp_alerts: []}

  # Negative: SMS wait after failed attempts for longer than half an hour.
  - name: sms not accepted
    interval: 1m
    input_series:
      - series: 'qd_sms_messages_last_day{status="failed"}'
        values: '0x120'
      - series: 'qd_sms_messages_last_day{status="retrying"}'
        values: '0x10 3x110'
    alert_rule_test:
      - {eval_time: 30m, alertname: SmsNotGoingOut, exp_alerts: []}
      - eval_time: 45m
        alertname: SmsNotGoingOut
        exp_alerts:
          - exp_labels: {severity: day, channel: operator-telegram, status: retrying}
            exp_annotations: {summary: "SMS are queued and not being accepted by the provider"}
      - {eval_time: 45m, alertname: SmsRefused, exp_alerts: []}

  # A provider that was slow for a few minutes and then accepted the message is nobody's alert.
  - name: sms retried and sent
    interval: 1m
    input_series:
      - series: 'qd_sms_messages_last_day{status="failed"}'
        values: '0x120'
      - series: 'qd_sms_messages_last_day{status="retrying"}'
        values: '0x10 2x10 0x100'
    alert_rule_test:
      - {eval_time: 18m, alertname: SmsNotGoingOut, exp_alerts: []}
      - {eval_time: 60m, alertname: SmsNotGoingOut, exp_alerts: []}
