# The repository passphrase is not stored here. It is read from the
# PGBACKREST_REPO1_CIPHER_PASS environment variable.
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=2
start-fast=y
process-max=2
log-level-console=info
log-level-file=off

[qarz]
pg1-path=/var/lib/postgresql/data
