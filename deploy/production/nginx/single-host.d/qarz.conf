# Qarz Daftari behind a Cloudflare Tunnel: one plain-HTTP listener for the tunnel's container.
#
# Who is believed about what:
#   - The visitor's ADDRESS is Cloudflare's CF-Connecting-IP header, taken only when the connection
#     comes from the tunnel's container (set_real_ip_from in /tmp/qd-tunnel-peer.conf). From any other
#     peer the header is ignored and the peer's own address counts. The limits, the access log and the
#     X-Forwarded-For handed to the API all use that one address.
#   - The visitor's SCHEME is Cloudflare's X-Forwarded-Proto header, on the same condition. A request
#     that is not known to have reached Cloudflare over HTTPS is redirected to HTTPS and served nothing,
#     exactly as port 80 of the other form does. So every answer below is an answer to an HTTPS visitor,
#     and Strict-Transport-Security and the Secure cookies are true as the browser sees them.
include /etc/nginx/snippets/limit-zones.conf;

# 1 when the request came through the tunnel and the visitor spoke HTTPS to Cloudflare.
map "$qd_from_tunnel:$http_x_forwarded_proto" $qd_visitor_https {
    default 0;
    "1:https" 1;
}
# 1 when the request is to be sent to HTTPS instead of answered. The container's own health check
# (from 127.0.0.1, see below) is the one request that is neither.
map "$qd_visitor_https:$request_uri" $qd_redirect_to_https {
    default 1;
    "~^1:" 0;
    "0:/nginx-health" 0;
}

server {
    listen 8080 default_server;
    server_name _;

    if ($qd_redirect_to_https) {
        return 301 https://$host$request_uri;
    }

    # For the container's own health check only.
    location = /nginx-health {
        allow 127.0.0.1;
        deny all;
        access_log off;
        include /etc/nginx/snippets/headers-api.conf;
        return 204;
    }

    # This hop is plain HTTP; the visitor's was HTTPS, or the request was redirected above.
    set $qd_forwarded_proto https;

    include /etc/nginx/snippets/app-server.conf;
}
