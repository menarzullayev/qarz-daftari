worker_processes auto;
pid /tmp/nginx.pid;

# nginx's error log quotes the whole request line, query string included, and its format cannot be
# changed. A query string may hold personal data, so only `crit` and above is written. What the lower
# levels would have said (a refused body, a limited request, an upstream that timed out) is in the
# access log as the status, `limited` and `upstream_s`.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/snippets/http-common.conf;
    include /etc/nginx/conf.d/*.conf;
}
