# The application, in the form that ends TLS itself: the only thing exposed to the internet when the proxy's
# ports are published (the two-server design, the local proof, the end-to-end suite). The form behind a
# Cloudflare Tunnel is single-host.d/qarz.conf; both include the same limits and the same routes.
include /etc/nginx/snippets/limit-zones.conf;

# --- Port 80: the certificate challenge and a redirect, nothing else -----------------------------------
server {
    listen 8080 default_server;
    server_name _;

    include /etc/nginx/snippets/headers-api.conf;

    # For the container's own health check only.
    location = /nginx-health {
        allow 127.0.0.1;
        deny all;
        access_log off;
        return 204;
    }

    # ACME HTTP-01 challenge files written by the operator's certificate client (see the README).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Port 443 ---------------------------------------------------------------------------------------------
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    # Mounted from the host, read-only: the full chain and the private key (see the README).
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:qd_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # What the API is told the caller's scheme was: this block is only ever reached over TLS.
    set $qd_forwarded_proto $scheme;

    include /etc/nginx/snippets/app-server.conf;
}
