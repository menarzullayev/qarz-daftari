# Qarz Daftari: the only thing exposed to the internet (docs/06-architecture, trust boundaries).
#
# Limits by client address. The application has its own limits per signed-in user and per shop
# (QD_RATE_*); these stand in front of them and also cover callers who are not signed in.
# Mobile operators put many subscribers behind one address, so the general limit is generous.
limit_req_zone $binary_remote_addr zone=qd_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=qd_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=qd_pay:10m rate=5r/s;
# Telegram delivers every shop's updates from a handful of addresses, so this zone is wider than the
# general one, not narrower; the route is narrowed in other ways (POST only, optional address list).
limit_req_zone $binary_remote_addr zone=qd_webhook:10m rate=30r/s;
# The pages and their files: static, hashed and cached, and one page is a document and a dozen files.
# Held to the general limit, two pages opened in one second were refused their scripts and stayed blank.
limit_req_zone $binary_remote_addr zone=qd_static:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=qd_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# --- Port 80: the certificate challenge and a redirect, nothing else -----------------------------------
server {
    listen 8080 default_server;
    server_name _;

    include /etc/nginx/snippets/headers-api.conf;

    # For the container's own health check only.
    location = /nginx-health {
        allow 127.0.0.1;
        deny all;
        access_log off;
        return 204;
    }

    # ACME HTTP-01 challenge files written by the operator's certificate client (see the README).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Port 443 ---------------------------------------------------------------------------------------------
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    # Mounted from the host, read-only: the full chain and the private key (see the README).
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:qd_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;

    # The application's general limit (body_limit.py, MAX_BODY): 1 MiB. Both refuse a body LARGER than
    # the limit, so the numbers are the same numbers. The upload routes below have their own.
    client_max_body_size 1048576;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 20s;
    keepalive_timeout 65s;

    limit_conn qd_conn 100;
    limit_req zone=qd_general burst=40 nodelay;

    # The API's address is looked up when a request arrives (Docker's resolver), not once at start, so
    # the API container can be replaced without restarting the proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $qd_api http://api:8000;

    # Default headers for anything not matched by a block with its own (redirects, 404).
    include /etc/nginx/snippets/headers-api.conf;

    # What the proxy itself refuses is answered in the shape of the API's errors.
    # `client_max_body_size 0` in each of the three: nginx looks at the size of the request's body again
    # when it enters the error location, and over HTTP/2, which is what every browser speaks, the body is
    # not yet marked as thrown away. Without it the refusal is refused a second time and the browser gets
    # nginx's stock HTML page instead of the JSON below (HTTP/1.1 clients such as curl never showed this).
    # These locations read no body: they answer at once.
    error_page 413 /__error/413;
    error_page 429 /__error/429;
    error_page 502 503 504 /__error/unavailable;
    location = /__error/413 {
        internal;
        client_max_body_size 0;
        include /etc/nginx/snippets/headers-api.conf;
        default_type application/json;
        return 413 "{\"error\":{\"code\":\"BODY_TOO_LARGE\",\"message\":\"So'rov juda katta.\",\"fields\":{}}}";
    }
    location = /__error/429 {
        internal;
        client_max_body_size 0;
        include /etc/nginx/snippets/headers-api.conf;
        add_header Retry-After "2" always;
        default_type application/json;
        return 429 "{\"error\":{\"code\":\"RATE_LIMITED\",\"message\":\"So'rovlar juda ko'p. Birozdan so'ng urinib ko'ring.\",\"fields\":{}}}";
    }
    location = /__error/unavailable {
        internal;
        client_max_body_size 0;
        include /etc/nginx/snippets/headers-api.conf;
        default_type application/json;
        return 503 "{\"error\":{\"code\":\"UNAVAILABLE\",\"message\":\"Xizmat vaqtincha ishlamayapti.\",\"fields\":{}}}";
    }

    # --- Never from outside ---------------------------------------------------------------------------
    # The metrics are read inside the compose network (api:8000/metrics, with the bearer token).
    location ^~ /metrics {
        return 404;
    }

    # --- The API ----------------------------------------------------------------------------------------
    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Sign-in, for staff and for administrators (second factor included): the strict zone on top of the
    # general one.
    location /api/v1/auth/ {
        limit_req zone=qd_auth burst=10 nodelay;
        limit_req zone=qd_general burst=40 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }
    location /api/admin/v1/auth/ {
        limit_req zone=qd_auth burst=10 nodelay;
        limit_req zone=qd_general burst=40 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }
    # The administrators' status route is the prefix above WITHOUT its last slash. For a proxied prefix
    # that ends in a slash nginx answers exactly that address with a redirect to the slashed one (and
    # names its own inner port in it), which the page's connect-src refuses: nobody got past the
    # administrators' sign-in. An exact match takes the address before that rule applies.
    location = /api/admin/v1/auth {
        limit_req zone=qd_auth burst=10 nodelay;
        limit_req zone=qd_general burst=40 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # The three routes with a larger allowance; the patterns and sizes are the application's own
    # (RECEIPT_UPLOAD and SUBSCRIPTION_RECEIPT_UPLOAD: 5 MiB + 16 KiB; IMPORT_UPLOAD: 5 MiB). nginx cannot
    # tie a size to a method, so a non-POST request here passes the proxy with the larger size and is
    # then held to 1 MiB by the application.
    location ~ "^/api/v1/me/accounts/[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}/payment-notices$" {
        client_max_body_size 5259264;
        include /etc/nginx/snippets/api-proxy.conf;
    }
    location ~ "^/api/v1/shops/[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}/subscription/receipts$" {
        client_max_body_size 5259264;
        include /etc/nginx/snippets/api-proxy.conf;
    }
    location ~ "^/api/v1/shops/[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}/imports$" {
        client_max_body_size 5242880;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Telegram's updates. To accept them from Telegram's networks only, create allow-telegram.conf from
    # allow-telegram.conf.example (it is not active by default: whether Telegram's published ranges are
    # the ones that reach a server in Uzbekistan has not been observed).
    location = /tg/webhook {
        limit_except POST {
            deny all;
        }
        include /etc/nginx/snippets/allow-telegram*.conf;
        limit_req zone=qd_webhook burst=60 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Payment providers' calls: a few hundred bytes each (online_payment_api.py, MAX_BODY = 16 KiB).
    location /pay/ {
        limit_except POST {
            deny all;
        }
        client_max_body_size 16384;
        limit_req zone=qd_pay burst=10 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Stored files, through the application only (it checks the signed, five-minute link).
    location /files/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location = /healthz {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # --- The three front-end entries (static files) ----------------------------------------------------
    # They use hash routes, so the fallback to index.html is only for a mistyped path below an entry.
    location = / {
        return 302 /panel/;
    }
    location = /app {
        return 301 /app/;
    }
    location = /panel {
        return 301 /panel/;
    }
    location = /admin {
        return 301 /admin/;
    }
    location /app/ {
        include /etc/nginx/snippets/headers-app.conf;
        limit_req zone=qd_static burst=300 nodelay;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }
    location /panel/ {
        include /etc/nginx/snippets/headers-panel.conf;
        limit_req zone=qd_static burst=300 nodelay;
        index index.html;
        try_files $uri $uri/ /panel/index.html;
    }
    location /admin/ {
        include /etc/nginx/snippets/headers-panel.conf;
        limit_req zone=qd_static burst=300 nodelay;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    location /assets/ {
        include /etc/nginx/snippets/headers-assets.conf;
        limit_req zone=qd_static burst=300 nodelay;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
