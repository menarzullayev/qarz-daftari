# The proxy behind a Cloudflare Tunnel (the single-host deployment). Started by single-host-entrypoint.sh
# with `nginx -c` instead of nginx.conf. It ends no TLS and publishes no port: the only caller is the
# tunnel's container, over plain HTTP on a Compose network that holds the two of them and nobody else.
worker_processes auto;
pid /tmp/nginx.pid;

# See nginx.conf: the error log would quote query strings.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/snippets/http-common.conf;
    # Written at start by single-host-entrypoint.sh from QD_TUNNEL_PEER: whose word about the visitor's
    # address is taken, and the variable $qd_from_tunnel.
    include /tmp/qd-tunnel-peer.conf;
    include /etc/nginx/single-host.d/*.conf;
}
