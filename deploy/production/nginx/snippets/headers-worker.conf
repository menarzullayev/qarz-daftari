# The panel's service worker (/panel/sw.js). The policy is the worker's own: it fetches the panel's page
# and built files from this origin, and can reach nothing else.
include /etc/nginx/snippets/headers-common.conf;
add_header Content-Security-Policy "default-src 'none'; connect-src 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
# Checked with the server every time it is asked for, so a deployment's worker replaces the one before
# it the next time the panel is opened. Never the year-long caching of the built files.
add_header Cache-Control "no-cache" always;
