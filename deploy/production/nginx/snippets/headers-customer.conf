# The page behind a customer's secret link (/k/). Whoever opens it is not signed in and may be anyone,
# so it is given less than any other page: scripts, styles and requests of this origin only; no image,
# no font, no frame, nothing of the device. It does not include headers-common.conf, because two of
# that file's headers are stricter here; the others are repeated.
add_header X-Request-Id $request_id always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# Nothing about this page is told to any other, not even its origin.
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), clipboard-write=()" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
# Never listed by a search engine, never kept by a browser or by anything in between.
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
add_header Cache-Control "no-store" always;
