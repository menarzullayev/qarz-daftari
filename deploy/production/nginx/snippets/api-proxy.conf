# Hands a request to the API. Included by every location that does so.
proxy_http_version 1.1;
proxy_set_header Connection "close";
proxy_set_header Host $host;
# The identifier is made here, never taken from the caller: 32 hexadecimal characters, which the
# application keeps (it accepts 8 to 64 of A-Z a-z 0-9 _ -).
proxy_set_header X-Request-Id $request_id;
# The caller's own forwarding headers are replaced, not extended. $remote_addr is the peer's address;
# behind the tunnel it is the visitor's address as Cloudflare reported it, and only when the peer is the
# tunnel's container (single-host-entrypoint.sh). $qd_forwarded_proto is set by the server block: the
# scheme the visitor used, which behind the tunnel is not the scheme of this hop.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $qd_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;

# The API cancels a database statement after 5 s; a request made of several statements, or an upload
# being stored, gets 20 s between two reads before the proxy gives up with 504.
proxy_connect_timeout 3s;
proxy_send_timeout 20s;
proxy_read_timeout 20s;

# A large download (an export may be 256 MiB) is passed on as it arrives, never spooled to /tmp.
proxy_max_temp_file_size 0;
gzip off;

# The proxy sets these itself (headers-api.conf); the application's copies would be duplicates.
proxy_hide_header X-Request-Id;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Cache-Control;
include /etc/nginx/snippets/headers-api.conf;

proxy_pass $qd_api;
