# The Mini App page (/app/). It loads Telegram's bridge script and may be framed by Telegram's web
# clients only; the mobile and desktop clients use a web view, which frame rules do not concern.
# X-Frame-Options cannot name an allowed site, so it is not sent here; frame-ancestors decides.
# Known and accepted: inside web.telegram.org the bridge script adds a <style> element (scroll bar
# appearance sent by the parent); `style-src 'self'` refuses it, which changes nothing but that.
include /etc/nginx/snippets/headers-staff.conf;
add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors https://web.telegram.org https://webk.telegram.org https://webz.telegram.org" always;
add_header Cache-Control "no-store" always;
