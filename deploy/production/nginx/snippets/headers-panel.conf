# The staff panel (/panel/) and the administrators' panel (/admin/). Never framed by anyone.
# They sign in with the Telegram Login widget: a script from telegram.org that opens a frame on
# oauth.telegram.org.
# 'unsafe-eval' is here for one reason: the pages give the widget its callback as `data-onauth`, and
# Telegram's script turns that attribute into a function with eval(). Without it nobody can sign in.
# Remove it as soon as the front end stops using `data-onauth` (see the README, "Decisions").
include /etc/nginx/snippets/headers-common.conf;
add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://telegram.org 'unsafe-eval'; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src https://oauth.telegram.org; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header Cache-Control "no-store" always;
