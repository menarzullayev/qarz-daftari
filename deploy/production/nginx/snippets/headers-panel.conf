# The staff panel (/panel/). Never framed by anyone. The administrators' panel has the same policy
# without the last two directives (headers-admin.conf).
# It signs in with the Telegram Login widget: a script from telegram.org that opens a frame on
# oauth.telegram.org.
# No 'unsafe-eval': the page uses the widget's redirect mode (`data-auth-url`), in which Telegram's script
# sends the browser back to the page with the signed fields in the query string. Its other mode, a
# callback in `data-onauth`, is built with eval() and must not come back (smoke.sh checks the policy).
# The panel can be installed: `manifest-src` lets the page read its own manifest and `worker-src` lets
# it register its own service worker, both from this origin only. Nothing else was added for it.
include /etc/nginx/snippets/headers-common.conf;
add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src https://oauth.telegram.org; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; worker-src 'self'; manifest-src 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header Cache-Control "no-store" always;
