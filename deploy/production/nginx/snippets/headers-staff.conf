# The headers of headers-common.conf for the two staff pages, the Mini App (/app/) and the panel (/panel/):
# the same lines, and a Permissions-Policy that also lets the page itself use the camera. Included by
# headers-app.conf and headers-panel.conf in place of headers-common.conf, so each header is still sent once.
# frontend/src/shared/stock/proxyCamera.test.ts holds the two files to that.
add_header X-Request-Id $request_id always;
# One year, this host only: no includeSubDomains and no preload, because the founder's other host names
# under the same domain are not known here.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# Another site learns the origin at most, never a path or a query string.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The pages use the clipboard (copying a code or a card number) and, to read a barcode in the stock's
# screens, the camera: this origin only, never a frame inside it. Nothing else of the device.
add_header Permissions-Policy "accelerometer=(), camera=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), clipboard-write=(self)" always;
