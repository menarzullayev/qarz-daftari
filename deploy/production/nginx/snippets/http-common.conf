# The http settings shared by both forms of the proxy: the one that ends TLS itself (nginx.conf, two
# servers) and the one behind a Cloudflare Tunnel (nginx.single-host.conf). Included inside http {}.
include /etc/nginx/mime.types;
default_type application/octet-stream;
charset utf-8;
server_tokens off;
sendfile on;
tcp_nopush on;

# The root file system is read-only; everything nginx writes goes to the tmpfs at /tmp.
client_body_temp_path /tmp/client_body;
proxy_temp_path /tmp/proxy;
fastcgi_temp_path /tmp/fastcgi;
uwsgi_temp_path /tmp/uwsgi;
scgi_temp_path /tmp/scgi;

# Access log: one JSON object a line, joined to the application's log by `request_id`.
# No query string, no body, no cookies, no referrer, no user agent: `path` is the request path up to
# the first "?". `remote_addr` is the address the limits count by; `peer` is the address the connection
# came from. They differ only behind the tunnel, where the peer is the tunnel's container and
# `remote_addr` the visitor Cloudflare named.
map $request_uri $qd_path {
    "~^(?<qd_path_only>[^?]*)" $qd_path_only;
    default "-";
}
log_format qd_json escape=json
    '{"time":"$time_iso8601","logger":"proxy","request_id":"$request_id",'
    '"remote_addr":"$remote_addr","peer":"$realip_remote_addr","scheme":"$scheme",'
    '"method":"$request_method",'
    '"path":"$qd_path","status":$status,"bytes_in":$request_length,"bytes_out":$body_bytes_sent,'
    '"seconds":$request_time,"upstream_s":"$upstream_response_time","limited":"$limit_req_status"}';
access_log /dev/stdout qd_json;

# Compression for the static files only. The API location turns it off again (its answers are small,
# and compressing answers that carry secrets next to caller-chosen text is the BREACH pattern).
# Brotli is not compiled into the stock nginx image and is not added.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

# What a cache is told about an answer of /files/catalog/ (image-proxy.conf): a photo of the shared
# catalogue, which the application marks as never changing, may be kept for a year by anyone; every
# other answer there (not found, an error, the catalogue switched off) by nobody.
map $upstream_http_cache_control $qd_image_cache {
    "~immutable" "public, max-age=31536000, immutable";
    default "no-store";
}
