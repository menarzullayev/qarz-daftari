# Hands a request for a photo of the shared catalogue to the API. Included by the one location that
# serves them. As api-proxy.conf in everything but the caching: a photo is addressed by the SHA-256 of
# its content, so what an address serves never changes and any cache may keep it; a refusal may not be
# kept ($qd_image_cache, http-common.conf).
proxy_http_version 1.1;
proxy_set_header Connection "close";
proxy_set_header Host $host;
proxy_set_header X-Request-Id $request_id;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $qd_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;

proxy_connect_timeout 3s;
proxy_send_timeout 20s;
proxy_read_timeout 20s;

proxy_max_temp_file_size 0;
gzip off;

# The proxy sets these itself; the application's copies would be duplicates.
proxy_hide_header X-Request-Id;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Cache-Control;
include /etc/nginx/snippets/headers-common.conf;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header Cache-Control $qd_image_cache always;

proxy_pass $qd_api;
