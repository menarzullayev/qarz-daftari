# Headers every answer carries. nginx drops inherited add_header lines as soon as a block has one of its
# own, so each block includes exactly one of the headers-*.conf files, and each of those includes this.
add_header X-Request-Id $request_id always;
# One year, this host only: no includeSubDomains and no preload, because the founder's other host names
# under the same domain are not known here.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# Another site learns the origin at most, never a path or a query string.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The pages use the clipboard (copying a code or a card number) and nothing else of the device.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), clipboard-write=(self)" always;
