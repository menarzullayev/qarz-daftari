# Overlay for the proof of the single-host stack ONLY (scripts/single-host-proof.sh), on top of
# compose.yml and compose.single-host.yml. Never used on the real machine.
#
# It replaces the two things the proof must not touch:
#   - Cloudflare R2 by a MinIO server inside the Compose network (`r2`), with a certificate of an
#     authority made for the occasion, because pgBackRest speaks to S3 over TLS only;
#   - the tunnel by a stand-in: the `cloudflared` service keeps its place (the same networks, the same
#     fixed address the proxy believes) but runs no cloudflared and holds no token. The proof makes its
#     requests from inside that container, which is where a real tunnel's requests come from.
# And it closes every way out, as compose.e2e.yml does: nothing the stack sends can leave the machine.

services:
  # One-shot: a certificate authority and a certificate for the name `r2`, into a volume.
  proof-certs:
    image: ${DEPLOY_PGBACKUP_IMAGE:-qarz-daftari/pgbackup}:${DEPLOY_PGBACKUP_TAG:?}
    restart: "no"
    network_mode: none
    user: "0:0"
    entrypoint: ["bash", "-ec"]
    command:
      - |
        cd /certs
        if [ ! -s public.crt ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 7 -subj "/CN=qd-proof-ca" \
            -keyout ca.key -out ca.crt 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj "/CN=r2" -keyout private.key -out r2.csr 2>/dev/null
          printf 'subjectAltName=DNS:r2\n' > san.cnf
          openssl x509 -req -in r2.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 7 \
            -extfile san.cnf -out public.crt 2>/dev/null
          rm -f ca.key r2.csr san.cnf ca.srl
          chmod 644 ca.crt public.crt private.key
        fi
    volumes:
      - proof-certs:/certs

  r2:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: "no"
    command: ["server", "/data", "--certs-dir", "/certs", "--address", ":443"]
    depends_on:
      proof-certs:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: ${DEPLOY_R2_ACCESS_KEY_ID:?}
      MINIO_ROOT_PASSWORD: ${DEPLOY_R2_SECRET_ACCESS_KEY:?}
      # R2 signs with the region `auto`; the stand-in is told the same, so the proof uses production's value.
      MINIO_REGION: auto
      MINIO_BROWSER: "off"
      MINIO_UPDATE: "off"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/certs/ca.crt", "--resolve", "r2:443:127.0.0.1", "https://r2/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - proof-certs:/certs:ro
      - proof-r2:/data
    networks: [egress]

  db:
    depends_on:
      r2:
        condition: service_healthy
    environment: &proof-r2
      QD_R2_CA_FILE: /proof-certs/ca.crt
    volumes:
      - proof-certs:/proof-certs:ro

  backup:
    environment:
      <<: *proof-r2
      # The proof starts every job itself; the schedule's own first run is checked separately.
      QD_CHECK_INTERVAL: "20"
    volumes:
      - proof-certs:/proof-certs:ro

  files-backup:
    environment:
      <<: *proof-r2
      QD_FILES_INTERVAL: "3600"
    volumes:
      - proof-certs:/proof-certs:ro

  restore:
    environment: *proof-r2
    volumes:
      - proof-certs:/proof-certs:ro

  restore-files:
    environment: *proof-r2
    volumes:
      - proof-certs:/proof-certs:ro

  db-scratch:
    environment: *proof-r2
    volumes:
      - proof-certs:/proof-certs:ro

  # The stand-in for the tunnel: same networks, same address, no cloudflared, no token.
  cloudflared:
    image: ${DEPLOY_PGBACKUP_IMAGE:-qarz-daftari/pgbackup}:${DEPLOY_PGBACKUP_TAG:?}
    entrypoint: ["sleep", "infinity"]
    command: !reset []
    environment: !reset {}
    healthcheck:
      test: ["CMD", "true"]
      interval: 2s

networks:
  egress:
    internal: true
  tunnel-out:
    internal: true

volumes:
  proof-certs: {}
  proof-r2: {}
