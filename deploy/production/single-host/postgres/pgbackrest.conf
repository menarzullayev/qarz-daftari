# pgBackRest on the single host (compose.single-host.yml). Baked into the image; nothing here is a secret.
#
# The repository is an S3 bucket: Cloudflare R2 in production, a stand-in in the proof. Where it is and
# who may write to it come from the environment, never from a file (set by compose from the env file):
#   PGBACKREST_REPO1_S3_ENDPOINT     <account id>.r2.cloudflarestorage.com
#   PGBACKREST_REPO1_S3_BUCKET       the bucket
#   PGBACKREST_REPO1_S3_REGION       auto
#   PGBACKREST_REPO1_S3_KEY          access key id of a key limited to that bucket
#   PGBACKREST_REPO1_S3_KEY_SECRET   its secret
#   PGBACKREST_REPO1_CIPHER_PASS     the backup passphrase (deploy/production/SINGLE-HOST.md, "The passphrase")

[global]
repo1-type=s3
repo1-path=/pgbackrest
# R2 has no virtual-host buckets under the account's endpoint.
repo1-s3-uri-style=path

# --- Encryption ----------------------------------------------------------------------------------
# Everything pgBackRest writes to the bucket (backups, WAL segments, its own manifests) is encrypted
# here, before it leaves this machine. Whoever holds the bucket without the passphrase holds nothing.
repo1-cipher-type=aes-256-cbc

# --- Compression ---------------------------------------------------------------------------------
compress-type=zst
compress-level=3
# Small files travel together: a database is a thousand files and more, and a bucket charges by the
# request. Set before the first backup; pgBackRest keeps reading backups made without it.
repo1-bundle=y

# --- Retention: the figures of deploy/backup/pgbackrest.conf (DEC-060), unchanged --------------------
# Weekly full (Sunday), daily differential. Every full of the last 56 days is kept, plus one older.
repo1-retention-full-type=time
repo1-retention-full=56
# WAL is kept continuously from the third-newest full on: any moment of the last 14 to 21 days.
repo1-retention-archive-type=full
repo1-retention-archive=3
repo1-retention-diff=14
# Expiry is its own job in the scheduler, so that removal has its own line in the log.
expire-auto=n

# --- Behaviour -----------------------------------------------------------------------------------
start-fast=y
process-max=2
# When the bucket cannot be reached, finished WAL segments wait in pg_wal. Past this size pgBackRest
# drops them instead of letting the disk fill and PostgreSQL stop: the shop keeps recording, the chain
# for point-in-time recovery is broken until the next backup, and check.sh says the archive is stale.
archive-push-queue-max=4GiB
# The root file system is read-only; locks go to the tmpfs. The log is the container's log.
lock-path=/tmp/pgbackrest
log-level-console=warn
log-level-file=off

[qarz]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
