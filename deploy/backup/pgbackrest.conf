# pgBackRest on the STANDBY server, which holds the backup repository (ADR-015).
# Install as /etc/pgbackrest/pgbackrest.conf, owner postgres, mode 0640.
# The primary's file is pgbackrest-primary.conf. Addresses below are placeholders for the two ends
# of the private link between the servers: replace 10.77.0.1 (primary) and 10.77.0.2 (standby).
#
# Never run on two real servers. Proven locally: the retention options parse and expire as written
# (deploy/backup/proof); the host options (pg2-host, SSH over the private link) are not proven.

[global]
repo1-path=/var/lib/pgbackrest

# --- Encryption ----------------------------------------------------------------------------------
# AES-256. The passphrase is NOT in this file and not in the repository: it is read from
#   /etc/pgbackrest/conf.d/cipher.conf      (owner postgres, mode 0600)
# which holds two lines:  [global]  and  repo1-cipher-pass=<passphrase>
# pgBackRest includes every *.conf of /etc/pgbackrest/conf.d by itself. The same passphrase must be
# kept in two places off both servers (README, "The key"); the copy on this server only lets the
# nightly backups run.
repo1-cipher-type=aes-256-cbc

# --- Compression ---------------------------------------------------------------------------------
compress-type=zst
compress-level=3

# --- Retention -----------------------------------------------------------------------------------
# Operations document, Backup: "Point-in-time recovery for 14 days; weekly backups for 8 weeks;
# monthly for 12 months". Full backups are weekly (Sunday), differentials daily.
#
# "Weekly backups for 8 weeks": a full backup is removed once it is older than 56 days AND a newer
# full that is itself at least 56 days old exists. So every full of the last 8 weeks stays, plus one
# older one; 9 fulls at most.
repo1-retention-full-type=time
repo1-retention-full=56
#
# "Point-in-time recovery for 14 days": WAL is kept continuously from the third-newest full backup
# on. With weekly fulls that full is between 14 and 21 days old, so any moment of the last 14 days
# can be restored, and on some days up to 21. pgBackRest counts WAL retention in backups, not days;
# 2 would give 7 to 14 days, which is less than the document asks. Older fulls keep only the WAL
# that makes each of them consistent: they restore to their own moment, not to any moment.
repo1-retention-archive-type=full
repo1-retention-archive=3
#
# Differentials serve the same 14 days: the newest 14 are kept (6 a week, so about 16 days).
repo1-retention-diff=14
#
# "Monthly for 12 months" cannot be said here: one repository keeps fulls by one rule. It is done
# beside the repository by scripts/monthly-archive.sh (a monthly logical dump, twelve kept).
#
# Expiry runs as its own job (scripts/expire.sh), not at the end of every backup.
expire-auto=n

# --- Behaviour -----------------------------------------------------------------------------------
start-fast=y
process-max=2
log-level-console=warn
log-level-file=info
log-path=/var/log/pgbackrest

[qarz]
# pg1: the standby's own PostgreSQL, on this server.
pg1-path=/var/lib/postgresql/16/main
# pg2: the primary, over the private link. pgBackRest finds out by itself which of the two is the
# primary and backs that one up; after a failover the roles swap without a change here.
pg2-host=10.77.0.1
pg2-host-user=postgres
pg2-path=/var/lib/postgresql/16/main
