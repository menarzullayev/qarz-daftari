# PostgreSQL settings for continuous archiving (ADR-015), on both database servers.
# Install as /etc/postgresql/16/main/conf.d/20-archive.conf and restart PostgreSQL (archive_mode needs it).
# The standby carries the same settings so that it archives from the moment it is promoted;
# with archive_mode = on a standby archives nothing while it is a standby.

wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=qarz archive-push %p'

# "Write-ahead log archived every minute": a segment that holds anything is closed and archived
# after 60 seconds at the latest. A segment nothing was written to is not closed; see
# scripts/archive-heartbeat.sh.
archive_timeout = 60
