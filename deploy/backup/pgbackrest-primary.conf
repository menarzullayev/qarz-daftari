# pgBackRest on the PRIMARY server. Install as /etc/pgbackrest/pgbackrest.conf, owner postgres, mode 0640.
# The repository is not here: it is on the standby (pgbackrest.conf), reached over the private link.
# Replace 10.77.0.2 with the standby's address on that link. No passphrase is needed on this server:
# encryption is done where the repository is.
#
# Not proven: the local rehearsal mounts the repository into every container instead.

[global]
repo1-host=10.77.0.2
repo1-host-user=postgres
compress-type=zst
compress-level=3
log-level-console=warn
log-level-file=info
log-path=/var/log/pgbackrest

[qarz]
pg1-path=/var/lib/postgresql/16/main
